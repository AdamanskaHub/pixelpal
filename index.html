<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelPal">
  <title>PixelPal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-tod="day">
  <div id="app">
    <section id="home" class="screen active" aria-label="Home"></section>
    <section id="stats" class="screen" aria-label="Stats"></section>
  </div>
  <div id="sheetBack"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Log an action"></div>
  <div id="overlay" role="dialog" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <noscript>PixelPal needs JavaScript.</noscript>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/creature.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
